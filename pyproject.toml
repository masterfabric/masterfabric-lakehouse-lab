[project]
name = "masterfabric-lakehouse-lab"
version = "0.1.0"
description = "A laptop-scale, runnable lakehouse on Apache Iceberg with synthetic telecom data."
license = "AGPL-3.0-only"
requires-python = ">=3.10"

[project.optional-dependencies]
tools = ["pytest>=8", "pillow>=11", "matplotlib>=3.9", "playwright>=1.48", "trino>=0.330"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
