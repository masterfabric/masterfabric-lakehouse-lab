# Trino reads and writes the same Iceberg tables through the same REST catalog as Spark.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://s3:9000
s3.region=${ENV:LAKE_S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:LAKE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAKE_S3_SECRET_KEY}
